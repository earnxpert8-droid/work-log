<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل العمل</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:#eef3fb;color:#1d2b3a;font-size:12px}
button,select,input{font-family:inherit}
#app{max-width:440px;height:100vh;height:100dvh;margin:0 auto;padding:2px 8px 0;display:flex;flex-direction:column;gap:2px}
.top{flex:0 0 auto;background:linear-gradient(135deg,#0b3a7a,#1d4ea0);color:#fff;border-radius:0 0 18px 18px;margin:0 -8px;padding:4px 10px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.top .l,.top .r{display:flex;gap:8px;align-items:center}
.top .r{justify-content:flex-end;font-size:14px;font-weight:bold}
.top .c b{font-size:14px;white-space:nowrap}
.hb{background:transparent;border:0;color:#fff;font-size:18px;padding:0;cursor:pointer;line-height:1}
.month{flex:0 0 auto;display:grid;grid-template-columns:40px 1fr 40px;gap:6px}
.month button,.month select{background:#fff;border:1px solid #d5dbe7;border-radius:10px;height:26px;padding:0 8px;font-size:12px;color:#0b3a7a;cursor:pointer}
.month select{font-weight:bold;text-align:center}
.stats{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px}
.st{position:relative;border-radius:10px;border:1px solid;height:26px;padding:0 8px 0 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.st i{position:absolute;left:5px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px}
.st small{font-size:10px;font-weight:bold}
.st b{font-size:13px}
.c-g{background:#e8f7ee;border-color:#bfe3cd;color:#1f8a4c}
.c-o{background:#fdf0e3;border-color:#f3d2ae;color:#d9822b}
.c-p{background:#f1ecfb;border-color:#d9cbf0;color:#7b4bb8}
.c-b{background:#e8f2fd;border-color:#bcd9f2;color:#1f6fb5}
.c-n{background:#eef0fb;border-color:#c9cfee;color:#2c3e8a}
.c-r{background:#fdebec;border-color:#f3c0c3;color:#d7262e}
.acts{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.acts button{height:24px;border:0;border-radius:10px;color:#fff;font-size:13px;font-weight:bold;cursor:pointer}
.y{background:#1f8a4c}.n{background:#d7262e}
.tb{flex:0 0 auto;background:#0d3b7a;color:#fff;border-radius:10px 10px 0 0;padding:0 12px;font-weight:bold;font-size:10px;line-height:1.6}
.tw{flex:1 1 auto;min-height:0;background:#fff;border:1px solid #d5dbe7;border-top:0;border-radius:0 0 10px 10px;overflow:hidden}
table{width:100%;height:100%;border-collapse:collapse;table-layout:fixed;font-size:clamp(7px,1.7vh,12px)}
th{background:#1d4ea0;color:#fff;font-weight:bold;padding:0 1px;line-height:1.2;white-space:nowrap;overflow:hidden}
th.n{background:#0d3b7a}
td{padding:0 2px;text-align:center;border-top:1px solid #e3e9f3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.05;cursor:pointer}
td.n{background:#e9eef5;color:#444}
tr:active td{opacity:.6}
.bd{display:inline-block;min-width:24px;padding:0 4px;border-radius:5px;font-weight:bold;line-height:1.35;color:#fff}
.bd.g{background:#1f8a4c}.bd.r{background:#d7262e}
.dash{color:#8a94a6}
#bg{display:none;position:fixed;inset:0;z-index:20}
#bg.on{display:block}
.pop{display:none;position:fixed;left:50%;transform:translateX(-50%);top:58px;width:min(240px,88vw);background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:6px;z-index:30}
.pop.on{display:block}
.pop div{padding:11px 14px;border-radius:10px;font-size:14px;cursor:pointer}
.pop div:active{background:#eef3fb}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.box{background:#fff;width:100%;max-width:440px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:12px 14px 16px}
.box .hd{display:flex;justify-content:space-between;align-items:center;font-weight:bold;color:#0b3a7a;font-size:15px;margin-bottom:6px}
.box .hd button{background:none;border:0;font-size:18px;cursor:pointer}
label{display:block;color:#6b7587;font-size:12px;margin:8px 0 3px}
input,select{width:100%;padding:8px;border:1px solid #cdd6e3;border-radius:10px;font-size:14px;background:#fff}
.row{display:flex;gap:6px;margin-top:12px}
.row button{flex:1;height:38px;border-radius:10px;border:1px solid #cdd6e3;background:#fff;font-size:14px;cursor:pointer}
.row .p{background:#1d4ea0;color:#fff;border-color:#1d4ea0;font-weight:bold}
.row .d{color:#d7262e;border-color:#d7262e}
.line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eef1f5}
.g2{border-radius:16px;background:#fff;margin-bottom:12px;overflow:hidden;box-shadow:0 2px 8px rgba(29,78,160,.08)}
.g2h{background:linear-gradient(180deg,#d9e7fb,#e9f1fc);display:flex;align-items:center;gap:8px;padding:8px 14px;font-weight:bold;color:#0b3a7a;font-size:14px}
.g2h i{width:26px;height:26px;border-radius:50%;background:#1d6fd6;color:#fff;display:grid;place-items:center;font-style:normal;font-size:13px}
.r2{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid #eef1f5;cursor:pointer}
.r2 .ic{width:40px;height:40px;border-radius:12px;background:#e8f2fd;display:grid;place-items:center;font-size:20px;flex:0 0 40px}
.r2 .tx{flex:1;text-align:right;font-size:15px;font-weight:bold;color:#1d2b3a}
.r2 .tx small{display:block;font-size:12px;color:#8a94a6;font-weight:normal}
.r2 .ar{color:#6b7587;font-size:20px}
.r2 input{border:0;background:transparent;font-size:15px;font-weight:normal;padding:0;height:auto;width:100%;text-align:right;outline:none;color:#1d2b3a}
.ver{display:inline-block;margin:0 auto;border:1px solid #b9cbe6;border-radius:999px;padding:4px 14px;color:#4a6fa5;font-size:12px;background:#f5f9ff}
#spl{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#16294a,#1F3864 50%,#0e1c33);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#spl h1{font-size:28px;margin:10px 0 4px}
#spl p{margin:0 0 24px;color:#cfe0ff}
#spl .go{width:100%;max-width:280px;height:46px;border:0;border-radius:12px;background:#fff;color:#12233f;font-size:16px;font-weight:bold;cursor:pointer}
#spl .sk{background:none;border:0;color:#b9c9e8;text-decoration:underline;margin-top:12px;cursor:pointer;font-size:12px}
</style>
</head>
<body>

<div id="spl">
  <div style="font-size:56px">🛡️</div>
  <h1>سجل العمل</h1>
  <p>تنظيم أيامك .. ضمان لحقوقك</p>
  <button class="go" onclick="startApp()">ابدأ الآن</button>
  <button class="sk" onclick="S.splash=false;save();startApp()">لا تُظهر هذه الشاشة مرة أخرى</button>
</div>

<div id="app">
  <div class="top">
    <div class="l"><button class="hb" onclick="toggleMenu()">☰</button></div>
    <div class="c"><b id="tName">BENKACI ABBES</b></div>
    <div class="r"><span>شعار 🛡️</span></div>
  </div>
  <div class="month">
    <button onclick="mv(-1)">›</button>
    <select id="msel" onchange="pick(this.value)"></select>
    <button onclick="mv(1)">‹</button>
  </div>
  <div class="stats">
    <div class="st c-g"><i>💼</i><small>أيام العمل</small><b id="sW">0</b></div>
    <div class="st c-o"><i>⛱️</i><small>العطل</small><b id="sO">0</b></div>
    <div class="st c-p"><i>🤲</i><small>الأفونس</small><b id="sA">0</b></div>
    <div class="st c-b"><i>🪙</i><small>المقبوض</small><b id="sM">0</b></div>
    <div class="st c-n" onclick="setTarget()"><i>📄</i><small>المستحق</small><b id="sT">0</b></div>
    <div class="st c-r"><i>📈</i><small>المتبقي</small><b id="sR">0</b></div>
  </div>
  <div class="acts">
    <button class="n" onclick="quick(false)">✗ عطلة اليوم</button>
    <button class="y" onclick="quick(true)">✓ عملت اليوم</button>
  </div>
  <div class="tb">📋 سجل الأيام</div>
  <div class="tw">
    <table>
      <colgroup><col style="width:6%"><col style="width:18%"><col style="width:10%"><col style="width:17%"><col style="width:10%"><col style="width:22%"><col style="width:17%"></colgroup>
      <thead><tr><th class="n">#</th><th>📅 التاريخ</th><th>💼 العمل</th><th>📍 المكان</th><th>🪙 أفونس</th><th>🚗 ديسامو</th><th>💳 مدفوعات</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<div id="bg" onclick="closeAll()"></div>
<div id="pop" class="pop">
  <div onclick="closeAll()">🏠 الرئيسية</div>
  <div onclick="panelSettings()">⚙️ الإعدادات</div>
</div>

<div id="panel" class="modal"><div class="box"><div class="hd"><span id="pT"></span><button onclick="closeAll()">✕</button></div><div id="pB"></div></div></div>

<div id="form" class="modal"><div class="box">
  <div class="hd"><span id="fT"></span><button onclick="closeAll()">✕</button></div>
  <label>📅 التاريخ</label><input type="date" id="fD">
  <label>💼 العمل</label>
  <select id="fW"><option value="">—</option><option value="نعم">نعم</option><option value="لا">لا</option></select>
  <label>📍 المكان</label><input id="fP">
  <label>🪙 أفونس (دج)</label><input id="fA" inputmode="numeric">
  <label>🚗 ديسامو (نص)</label><input id="fB">
  <label>💳 مدفوعات (دج)</label><input id="fM" inputmode="numeric">
  <div class="row"><button class="p" onclick="saveForm()">حفظ</button><button onclick="closeAll()">إلغاء</button><button class="d" onclick="clearForm()">مسح اليوم</button></div>
</div></div>

<script>
const $ = id => document.getElementById(id);
const MO = ['جانفي','فيفري','مارس','أفريل','ماي','جوان','جويلية','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const KEY = 'worklog-app-v5';

function blank() { return Array.from({length:30}, () => ({d:'', w:null, p:'', af:'', dp:'', md:''})); }

let S = JSON.parse(localStorage.getItem(KEY)) || {
  name: 'BENKACI ABBES',
  cur: '2026-09',
  months: {'2026-09': blank()},
  target: {'2026-09': 3700},
  splash: true
};

function save() { localStorage.setItem(KEY, JSON.stringify(S)); }
function mkey(y,m) { return y+'-'+String(m).padStart(2,'0'); }
function ensure(k) { if(!S.months[k]) S.months[k] = blank(); return S.months[k]; }
function E() { return ensure(S.cur); }
function fmt(v) { return !v ? '<span class="dash">-</span>' : v + ' دج'; }
function label(k) { return MO[+k.slice(5)-1]+' '+k.slice(0,4); }

function render() {
  $('tName').textContent = S.name;
  const yrs = new Set([S.cur.slice(0,4), ...Object.keys(S.months).map(k=>k.slice(0,4))]);
  const keys = []; yrs.forEach(y => { for(let m=1; m<=12; m++) keys.push(y+'-'+String(m).padStart(2,'0')); });
  keys.sort();
  $('msel').innerHTML = keys.map(k => `<option value="${k}" ${k===S.cur?'selected':''}>${label(k)}</option>`).join('');
  
  const rows = E(); let w=0, o=0, a=0, m=0;
  rows.forEach(r => { if(r.w===true) w++; if(r.w===false) o++; a += Number(r.af)||0; m += Number(r.md)||0; });
  const t = S.target[S.cur] || 0;
  $('sW').textContent = w; $('sO').textContent = o; $('sA').textContent = a; $('sM').textContent = m; $('sT').textContent = t; $('sR').textContent = t - (a+m);$('rows').innerHTML = rows.map((r,i) => `<tr onclick="openForm(${i})"><td class="n">${i+1}</td><td>${r.d||'<span class="dash">-</span>'}</td><td>${r.w===true?'<span class="bd g">نعم</span>':r.w===false?'<span class="bd r">لا</span>':'<span class="dash">-</span>'}</td><td>${r.p||'<span class="dash">-</span>'}</td><td>${fmt(r.af)}</td><td>${r.dp||'<span class="dash">-</span>'}</td><td>${fmt(r.md)}</td></tr>`).join('');
}

function mv(d) { const [y,m] = S.cur.split('-').map(Number); const n = new Date(y, m-1+d, 1); S.cur = mkey(n.getFullYear(), n.getMonth()+1); ensure(S.cur); save(); render(); }
function pick(k) { S.cur = k; ensure(k); save(); render(); }

function quick(w) {
  const rows = E(); const i = rows.findIndex(r => r.w === null);
  if(i<0) { alert('السجل مكتمل لهذا الشهر'); return; }
  rows[i].w = w; save(); render(); openForm(i);
}

let editIdx = -1;
function openForm(i) {
  editIdx = i; const r = E()[i];
  $('fT').textContent = 'اليوم رقم '+(i+1);
  $('fD').value = r.d ? r.d.split('-').reverse().join('-') : new Date().toISOString().slice(0,10);
  $('fW').value = r.w===true?'نعم':r.w===false?'لا':'';
  $('fP').value = r.p||''; $('fA').value = r.af\vert{}\vert{}'';$('fB').value = r.dp||''; $('fM').value = r.md\vert{}\vert{}'';$('form').classList.add('on');
}

function saveForm() {
  const r = E()[editIdx];
  const v = $('fD').value; r.d = v ? v.split('-').reverse().join('-') : '';
  r.w = $('fW').value==='نعم'?true:$('fW').value==='لا'?false:null;
  r.p = $('fP').value.trim(); r.af =$('fA').value.trim(); r.dp = $('fB').value.trim(); r.md =$('fM').value.trim();
  save(); closeAll(); render();
}

function clearForm() { const r = E()[editIdx]; Object.assign(r, {d:'', w:null, p:'', af:'', dp:'', md:''}); save(); closeAll(); render(); }
function setTarget() { const v = prompt('أدخل المستحق لهذا الشهر:', S.target[S.cur]||0); if(v!==null) { S.target[S.cur] = Number(v)||0; save(); render(); } }

function toggleMenu() { const p = $('pop'), on = !p.classList.contains('on'); closeAll(); if(on) { p.classList.add('on');$('bg').classList.add('on'); } }
function closeAll() { ['pop','panel','form'].forEach(id => $(id).classList.remove('on'));$('bg').classList.remove('on'); }
function openPanel(t,h) { closeAll(); $('pT').textContent = t; $('pB').innerHTML = h; $('panel').classList.add('on');$('bg').classList.add('on'); }

/* --- زر مشاركة التطبيق ورابط التحميل المباشر --- */
function shareApp() {
  const downloadUrl = 'https://apk.e-droid.net/apk/app4216978-9g6lua.apk?v=1';
  if(navigator.share) {
    navigator.share({
      title: 'سجل العمل',
      text: 'حمل تطبيق سجل العمل ومتابعة المستحقات والأيام المباشر:',
      url: downloadUrl
    }).catch(()=>{});
  } else {
    openPanel('مشاركة التطبيق', `<p style="line-height:1.8">رابط تحميل التطبيق المباشر:<br><a href="${downloadUrl}" target="_blank" style="word-break:break-all;color:#1d4ea0;font-weight:bold">${downloadUrl}</a></p>`);
  }
}

function panelSettings() {
  openPanel('الإعدادات', `
  <div class="g2"><div class="g2h"><span>الملف الشخصي</span><i>👤</i></div>
    <div class="r2"><span class="ic">✏️</span><div class="tx">الاسم<input id="sN" value="${S.name}" onchange="S.name=this.value;save();render();"></div></div>
  </div>
  <div class="g2"><div class="g2h"><span>التطبيق</span><i>📦</i></div>
    <div class="r2" onclick="shareApp()"><span class="ic">↗️</span><div class="tx">قم بمشاركة التطبيق<small>تحميل APK مباشر</small></div><span class="ar">‹</span></div>
  </div>
  <div style="text-align:center;color:#6b7587;font-size:12px;line-height:1.8;margin-top:10px">
    سجل العمل<br><span class="ver">الإصدار 4.0</span>
  </div>`);
}

function startApp() { $('spl').style.display = 'none'; render(); }

if(S.splash===false) { $('spl').style.display = 'none'; }
render();
</script>
</body>
</html>
