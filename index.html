<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل العمل</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:#eef3fb;color:#1d2b3a;font-size:12px}
button,select,input{font-family:inherit}
#app{max-width:440px;height:100vh;height:100dvh;margin:0 auto;padding:2px 8px 0;display:flex;flex-direction:column;gap:2px}
.top{flex:0 0 auto;background:linear-gradient(135deg,#0b3a7a,#1d4ea0);color:#fff;border-radius:0 0 18px 18px;margin:0 -8px;padding:4px 10px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.top .l,.top .r{display:flex;gap:8px;align-items:center}
.top .r{justify-content:flex-end;font-size:14px;font-weight:bold}
.top .c b{font-size:14px;white-space:nowrap}
.hb{background:transparent;border:0;color:#fff;font-size:18px;padding:0;cursor:pointer;line-height:1}
.month{flex:0 0 auto;display:grid;grid-template-columns:40px 1fr 40px;gap:6px}
.month button,.month select{background:#fff;border:1px solid #d5dbe7;border-radius:10px;height:26px;padding:0 8px;font-size:12px;color:#0b3a7a;cursor:pointer}
.month select{font-weight:bold;text-align:center}
.stats{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px}
.st{position:relative;border-radius:10px;border:1px solid;height:26px;padding:0 8px 0 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.st i{position:absolute;left:5px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px}
.st small{font-size:10px;font-weight:bold}
.st b{font-size:13px}
.st em{font-size:9px;font-style:normal;font-weight:bold;margin-inline-start:2px}
.c-g{background:#e8f7ee;border-color:#bfe3cd;color:#1f8a4c}
.c-o{background:#fdf0e3;border-color:#f3d2ae;color:#d9822b}
.c-p{background:#f1ecfb;border-color:#d9cbf0;color:#7b4bb8}
.c-b{background:#e8f2fd;border-color:#bcd9f2;color:#1f6fb5}
.c-n{background:#eef0fb;border-color:#c9cfee;color:#2c3e8a}
.c-r{background:#fdebec;border-color:#f3c0c3;color:#d7262e}
.acts{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.acts button{height:24px;border:0;border-radius:10px;color:#fff;font-size:13px;font-weight:bold;cursor:pointer}
.y{background:#1f8a4c}.n{background:#d7262e}
.tb{flex:0 0 auto;background:#0d3b7a;color:#fff;border-radius:10px 10px 0 0;padding:0 12px;font-weight:bold;font-size:10px;line-height:1.6}
.tw{flex:1 1 auto;min-height:0;background:#fff;border:1px solid #d5dbe7;border-top:0;border-radius:0 0 10px 10px;overflow:hidden}
table{width:100%;height:100%;border-collapse:collapse;table-layout:fixed;font-size:clamp(7px,1.7vh,12px)}
th{background:#1d4ea0;color:#fff;font-weight:bold;padding:0 1px;line-height:1.2;white-space:nowrap;overflow:hidden}
th.n{background:#0d3b7a}
td{padding:0 2px;text-align:center;border-top:1px solid #e3e9f3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.05;cursor:pointer}
td.n{background:#e9eef5;color:#444}
tr:active td{opacity:.6}
.bd{display:inline-block;min-width:24px;padding:0 4px;border-radius:5px;font-weight:bold;line-height:1.35;color:#fff}
.bd.g{background:#1f8a4c}.bd.r{background:#d7262e}
.dash{color:#8a94a6}
#bg{display:none;position:fixed;inset:0;z-index:20}
#bg.on{display:block}
.pop{display:none;position:fixed;left:50%;transform:translateX(-50%);top:58px;width:min(240px,88vw);background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:6px;z-index:30}
.pop.on{display:block}
.pop div{padding:11px 14px;border-radius:10px;font-size:14px;cursor:pointer}
.pop div:active{background:#eef3fb}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.box{background:#fff;width:100%;max-width:440px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:12px 14px 16px}
.box .hd{display:flex;justify-content:space-between;align-items:center;font-weight:bold;color:#0b3a7a;font-size:15px;margin-bottom:6px}
.box .hd button{background:none;border:0;font-size:18px;cursor:pointer}
label{display:block;color:#6b7587;font-size:12px;margin:8px 0 3px}
input,select{width:100%;padding:8px;border:1px solid #cdd6e3;border-radius:10px;font-size:14px;background:#fff}
.row{display:flex;gap:6px;margin-top:12px}
.row button{flex:1;height:38px;border-radius:10px;border:1px solid #cdd6e3;background:#fff;font-size:14px;cursor:pointer}
.row .p{background:#1d4ea0;color:#fff;border-color:#1d4ea0;font-weight:bold}
.row .d{color:#d7262e;border-color:#d7262e}
.tg{display:flex;gap:6px}
.tg button{flex:1;height:36px;border:1px solid #cdd6e3;border-radius:10px;background:#fff;cursor:pointer}
.tg .on1{background:#1f8a4c;color:#fff;border-color:#1f8a4c}
.tg .on0{background:#d7262e;color:#fff;border-color:#d7262e}
.bar{height:8px;background:#e6ebf2;border-radius:6px;overflow:hidden;margin:4px 0 8px}
.bar span{display:block;height:100%;background:#1d4ea0}
.line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eef1f5}
#stm{display:none;position:fixed;inset:0;background:#fff;z-index:45;flex-direction:column;max-width:440px;margin:0 auto}
#stm.on{display:flex}
.sth{flex:0 0 auto;background:linear-gradient(90deg,#0e3a78,#1d4ea0);color:#fff;text-align:center;font-weight:bold;font-size:14px;padding:8px}
.scards{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:6px}
.sc{border-radius:10px;border:1px solid;height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:11px;font-weight:bold}
.sc b{font-size:12px}
.sc i{font-style:normal;font-size:12px}
.sc.nt{grid-column:span 2;background:#f1f4fa;border:1px solid #c7d0e4;color:#444;font-weight:normal;justify-content:center}
.sc.g{background:#e8f7ee;border-color:#bfe3cd;color:#1f8a4c}
.sc.o{background:#fdf0e3;border-color:#f3d2ae;color:#d9822b}
.sc.p{background:#f1ecfb;border-color:#d9cbf0;color:#7b4bb8}
.sc.m{background:#e6f5f0;border-color:#a9d9c7;color:#1f7a5c}
.sc.b{background:#e8f2fd;border-color:#bcd9f2;color:#1f6fb5}
.sc.n{background:#eef0fb;border-color:#c9cfee;color:#2c3e8a}
.sc.r{background:#fdebec;border-color:#f3c0c3;color:#d7262e}
.stw{flex:1 1 auto;min-height:0;margin:0 6px;border:1px solid #d5dbe7;border-radius:10px;overflow:hidden}
.stw table{width:100%;height:100%;border-collapse:collapse;table-layout:fixed;font-size:clamp(7px,1.6vh,11px)}
.stw th{background:#1d4ea0;color:#fff;font-weight:bold;padding:2px;white-space:nowrap;overflow:hidden}
.stw td{border-top:1px solid #e3e9f3;text-align:center;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.stw td.n{background:#e9eef5;color:#444}
.stw tr.off td:not(.n){background:#fde3d6}
.sbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:6px}
.sbar .b1{background:#1d4ea0;color:#fff;border-color:#1d4ea0;font-weight:bold}
.sbar .b2{background:#fdeedd;color:#b55d1a;border-color:#f0c9a0;font-weight:bold}
.sbar .b3{background:#d9f3e6;color:#1b7a4e;border-color:#9fd8bb;font-weight:bold}
.sbar .b4{background:#efe3fb;color:#6d3fa6;border-color:#cdb5ea;font-weight:bold}
.sbar button{height:34px;border-radius:10px;border:1px solid #c9d3e6;background:#fff;font-size:12px;cursor:pointer}
.sbar .back{background:#1f3a63;color:#fff;border-color:#1f3a63;font-weight:bold}
@media print{body>*:not(#stm){display:none!important}#stm{position:static;display:flex!important;max-width:none}#stm .sbar{display:none}}
#form .box{background:linear-gradient(180deg,#eef4ff 0%,#fff 35%)}
#form .hd{background:linear-gradient(135deg,#0b3a7a,#1d4ea0);color:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 4px 12px rgba(11,58,122,.3)}
#form .hd button{color:#fff}
#form label{font-weight:bold;font-size:13px;color:#0b3a7a;margin-top:10px}
#form input,#form select{border:2px solid #cdd6e3;border-radius:12px;background:#fff;height:42px}
#fD{border-color:#1d4ea0!important}
#fW{border-color:#1f8a4c!important}
#fP{border-color:#d9822b!important}
#fA{border-color:#7b4bb8!important}
#fB{border-color:#1f6fb5!important}
#fM{border-color:#1f8a4c!important}
#fPr{background:#e8f7ee;border-radius:10px;padding:7px 10px;margin-top:8px}
#form .row{margin-top:16px}
#form .row button{height:44px;border-radius:12px;font-size:15px}
#form .row .p{background:linear-gradient(135deg,#1d4ea0,#2c6fd6);color:#fff;border:0;box-shadow:0 4px 10px rgba(29,78,160,.3)}
#form .row .d{background:#fff5f5;color:#d7262e;border:2px solid #d7262e}
#form .row button:not(.p):not(.d){background:#f1f4fa;color:#333;border:2px solid #cdd6e3}
#form .box{padding:6px 12px 8px;max-height:100%;overflow:hidden}
#form .hd{padding:6px 10px;font-size:14px}
#form label{margin-top:3px;margin-bottom:2px;font-size:12px}
#form input,#form select{height:32px;padding:3px 8px;font-size:14px;border-width:2px}
#fPr{padding:3px 8px;margin-top:3px;font-size:12px}
#form .row{margin-top:6px;gap:6px}
#form .row button{height:36px;font-size:14px}
.sg{background:#fff;border:1px solid #e3e9f3;border-radius:14px;overflow:hidden;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.sgh{color:#fff;font-weight:bold;padding:7px 12px;font-size:13px}
.sbody{padding:4px 10px 6px}
.sbody label{margin-top:6px}
.sr{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #eef1f5;cursor:pointer}
.sr:last-child{border-bottom:0}
.sr .lbl{flex:1;font-size:14px}
.sr b{color:#6b7587;font-size:14px}
.ch{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;flex:0 0 30px}
.soon{font-size:11px;background:#eef0fb;color:#2c3e8a;padding:2px 8px;border-radius:999px}
.danger .lbl{color:#d7262e}
.tg2{width:42px;height:24px;border-radius:999px;background:#cdd6e3;position:relative;flex:0 0 42px}
.tg2 i{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tgon{background:#1f8a4c}
.tgon i{right:auto;left:2px}
.g2{border-radius:16px;background:#fff;margin-bottom:12px;overflow:hidden;box-shadow:0 2px 8px rgba(29,78,160,.08)}
.g2h{background:linear-gradient(180deg,#d9e7fb,#e9f1fc);display:flex;align-items:center;gap:8px;padding:8px 14px;font-weight:bold;color:#0b3a7a;font-size:14px}
.g2h i{width:26px;height:26px;border-radius:50%;background:#1d6fd6;color:#fff;display:grid;place-items:center;font-style:normal;font-size:13px}
.r2{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid #eef1f5;cursor:pointer}
.r2 .ic{width:40px;height:40px;border-radius:12px;background:#e8f2fd;display:grid;place-items:center;font-size:20px;flex:0 0 40px}
.r2 .tx{flex:1;text-align:right;font-size:15px;font-weight:bold;color:#1d2b3a}
.r2 .tx small{display:block;font-size:12px;color:#8a94a6;font-weight:normal}
.r2 .ar{color:#6b7587;font-size:20px}
.r2 input{border:0;background:transparent;font-size:15px;font-weight:normal;padding:0;height:auto;width:100%;text-align:right;outline:none;color:#1d2b3a}
.ver{display:inline-block;margin:0 auto;border:1px solid #b9cbe6;border-radius:999px;padding:4px 14px;color:#4a6fa5;font-size:12px;background:#f5f9ff}
body.dark{background:#121826;color:#e8eefb}
body.dark .box,body.dark .g2,body.dark .sg,body.dark .pop,body.dark .r2{background:#1b2333!important;color:#e8eefb}
body.dark .g2h,body.dark .sgh{background:#22304a!important;color:#e8eefb}
body.dark .r2 .tx,body.dark .sr .lbl{color:#e8eefb}
body.dark .r2 .ic,body.dark .ch{background:#263454!important}
body.dark .tw,body.dark table,body.dark td{background:#1b2333!important;color:#e8eefb;border-color:#2c3850!important}

body.dark td.n{background:#263454!important;color:#cfd8ea!important}
body.dark .month button,body.dark .month select,body.dark .box input,body.dark .box select{background:#222c40!important;color:#e8eefb!important;border-color:#3a4a6b!important}
body.dark .st{filter:brightness(.9)}
body.dark #stm{background:#121826!important;color:#e8eefb}
body.dark .stw,body.dark .scards{background:#1b2333!important}

body.dark .tb{background:#22427a}
body.dark label{color:#aebbd6!important}
body.dark .dash,body.dark .r2 .tx small{color:#8f9bb5!important}
#spl{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#16294a,#1F3864 50%,#0e1c33);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#spl h1{font-size:28px;margin:10px 0 4px}
#spl p{margin:0 0 24px;color:#cfe0ff}
#spl .go{width:100%;max-width:280px;height:46px;border:0;border-radius:12px;background:#fff;color:#12233f;font-size:16px;font-weight:bold;cursor:pointer}

<body>
<div id="spl">
  <div style="font-size:56px">🛡️</div>
  <h1>سجل العمل</h1>
  <p>تنظيم أيامك .. ضمان لحقوقك</p>
  <button class="go" onclick="startApp()">ابدأ الآن</button>
  <button class="sk" onclick="S.splash=false;save();startApp()">لا تُظهر هذه الشاشة مرة أخرى</button>
</div>

<div id="app">
  <div class="top">
    <div class="l"><button class="hb" onclick="toggleMenu()">☰</button><button class="hb" onclick="panelStatement()">🧾</button></div>
    <div class="c"><b id="tName"></b></div>
    <div class="r"><button class="hb" onclick="panelLoc()">🌦️</button><span>شعار 🛡️</span></div>
  </div>
  <div class="month"><button onclick="mv(-1)">›</button><select id="msel" onchange="pick(this.value)"></select><button onclick="mv(1)">‹</button></div>
  <div class="stats">
    <div class="st c-g"><i>💼</i><small>أيام العمل</small><b id="sW"></b></div>
    <div class="st c-o"><i>⛱️</i><small>العطل</small><b id="sO"></b></div>
    <div class="st c-p"><i>🤲</i><small>الأفونس</small><b id="sA"></b></div>
    <div class="st c-b"><i>🪙</i><small>المقبوض</small><b id="sM"></b></div>
    <div class="st c-n" onclick="setTarget()"><i>📄</i><small>المستحق</small><b id="sT"></b></div>
    <div class="st c-r"><i>📈</i><small>المتبقي</small><b id="sR"></b></div>
  </div>
  <div class="acts"><button class="n" onclick="quick(false)">✗ عطلة اليوم</button><button class="y" onclick="quick(true)">✓ عملت اليوم</button></div>
  <div class="tb">📋 سجل الأيام</div>
  <div class="tw">
    <table>
      <colgroup><col style="width:6%"><col style="width:18%"><col style="width:10%"><col style="width:17%"><col style="width:10%"><col style="width:22%"><col style="width:17%"></colgroup>
      <thead><tr><th class="n">#</th><th>📅 التاريخ</th><th>💼 العمل</th><th>📍 المكان</th><th>🪙 أفونس</th><th>🚗 ديبلاصمو</th><th>💳 مدفوعات</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<div id="stm"></div>
<div id="bg" onclick="closeAll()"></div>
<div id="pop" class="pop">
  <div onclick="closeAll()">🏠 الرئيسية</div>
  <div onclick="panelStats()">📊 الإحصائيات</div>
  <div onclick="panelReports()">📄 التقارير</div>
  <div onclick="panelSettings()">⚙️ الإعدادات</div>
</div>

<div id="panel" class="modal"><div class="box"><div class="hd"><span id="pT"></span><button onclick="closeAll()">✕</button></div><div id="pB"></div></div></div>

<div id="form" class="modal"><div class="box">
  <div class="hd"><span id="fT"></span><button onclick="closeAll()">✕</button></div>
  <label>📅 التاريخ</label><input type="date" id="fD">
  <label>💼 العمل</label>
  <select id="fW" onchange="updPr()"><option value="">—</option><option value="نعم">نعم</option><option value="لا">لا</option></select>
  <label>📍 المكان (يُحدد تلقائياً)</label><input id="fP" list="plist" oninput="updPr()"><datalist id="plist"></datalist>
  <div id="fPr" style="font-size:12px;color:#1f8a4c;font-weight:bold;margin-top:4px"></div>
  <label>🪙 أفونس (دج)</label><input id="fA" inputmode="numeric">
  <label>🚗 ديبلاصمو (نص)</label><input id="fB">
  <label>💳 مدفوعات (دج)</label><input id="fM" inputmode="numeric">
  <div class="row"><button class="p" onclick="saveForm()">حفظ</button><button onclick="closeAll()">إلغاء</button><button class="d" onclick="clearForm()">مسح اليوم</button></div>
</div></div>

<script>

function seedMonth(){const a=blank();SEED.forEach((r,i)=>{if(i>=30)return;const x=a[i];x.d=r[0].trim();x.w=r[1]===''?null:r[1];x.p=r[2];x.af=r[3];x.dp=r[4];x.md=r[5]});return a}

function fit(){
  const tw=document.querySelector('.tw'),tb=tw.querySelector('table'),rows=tb.rows;
  const n=rows.length-1;if(n<1)return;
  const h=tw.clientHeight-rows[0].offsetHeight-2;
  const rh=Math.max(9,Math.floor(h/n));
  for(let i=1;i<rows.length;i++)rows[i].style.height=rh+'px';
  tb.style.fontSize=Math.max(6,Math.min(12,rh*0.62))+'px';
}

function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

  g.fillStyle='#fff';g.font='bold 20px Tahoma';g.textAlign='center';g.textBaseline='middle';

  const cols=[50,150,90,170,120,160,120],heads=['#','الأيام','العمل','المكان','أفونس','ديسامو','مدفوعات'],X0=20,TW=860;

  s.rows.slice(0,n).forEach((r,i)=>{
    const y=TY+RH*(i+1),vals=[i+1,r.d,r.w===true?'نعم':r.w===false?'لا':'',r.p,r.af!==''?r.af+' دج':'',r.dp,r.md!==''?r.md+' دج':''];
    g.fillStyle=r.w===false?'#fde3d6':'#fff';g.fillRect(X0,y,TW,RH);

}

async function toggleNotif(){
  const n=S.notif||(S.notif={on:false,time:'18:00'});
  if(!n.on){
    if(!('Notification' in window)){alert('المتصفح لا يدعم التنبيهات');return}
    const p=await Notification.requestPermission();
    if(p!=='granted'){alert('لم تُمنح إذن التنبيهات');return}
    n.on=true;
  }else n.on=false;
  save();notifPanel();alert(n.on?'تم تفعيل التنبيه عند '+(n.time||'18:00'):'تم إيقاف التنبيه');
}
function setNotifTime(){S.notif=S.notif||{on:false};S.notif.time=$('nT').value||'18:00';save();alert('تم حفظ وقت التنبيه: '+S.notif.time);notifPanel()}
function checkNotif(){
  const n=S.notif;
  if(!n||!n.on||!('Notification' in window)||Notification.permission!=='granted')return;
  const now=new Date(),t=today(),hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  if(hm<(n.time||'18:00')||n.last===t)return;
  const rows=ensure(mkey(now.getFullYear(),now.getMonth()+1));
  const row=rows.find(r=>r.d===t);
  if(row&&row.w!==null){n.last=t;save();return}
  new Notification('سجل العمل',{body:'لا تنسَ تسجيل يوم العمل اليوم'});
  n.last=t;save();
}
